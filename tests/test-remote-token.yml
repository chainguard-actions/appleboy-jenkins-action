name: Test Jenkins trigger with remote token authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trigger Jenkins job with remote token (expect failure - no server)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://localhost:8080"
          job: "remote-trigger-job"
          remote_token: "my-remote-trigger-token"
          wait: "false"
          insecure: "false"

      - name: Assert action failed due to unreachable server
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins is unreachable, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins server is unreachable (remote token mode)"
