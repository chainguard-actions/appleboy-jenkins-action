name: Test Jenkins trigger with debug mode and parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trigger Jenkins job with debug and parameters (expect failure - no server)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://localhost:8080"
          user: "admin"
          token: "fake-token"
          job: "parameterized-job"
          parameters: |
            BRANCH=main
            ENV=staging
            VERSION=1.0.0
          debug: "true"
          wait: "false"
          insecure: "false"

      - name: Assert action failed due to unreachable server
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins is unreachable, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins server is unreachable (debug+params mode)"
