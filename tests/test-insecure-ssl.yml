name: Test insecure SSL mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://127.0.0.1:19999"
          user: "testuser"
          token: "testtoken"
          job: "test-job"
          insecure: "true"
      - name: Assert action failed due to connection error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins is unreachable, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins is unreachable (insecure SSL mode)"
