name: Test insecure SSL option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with insecure SSL enabled (expect failure - no Jenkins)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "https://127.0.0.1:19997/"
          user: "admin"
          token: "fake-token"
          job: "test-job"
          insecure: "true"

      - name: Assert action failed gracefully with insecure SSL flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins URL is unreachable, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins HTTPS URL is unreachable (insecure=true accepted)"
