name: Test Jenkins action with insecure SSL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Start a mock Jenkins server on HTTP (simulating insecure connection scenario)
      - name: Start mock Jenkins server
        run: |
          cat > /tmp/jenkins_insecure_server.py << 'EOF'
          import http.server
          import socketserver
          import json

          class JenkinsHandler(http.server.BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_GET(self):
                  if '/crumbIssuer/api/json' in self.path:
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({
                          "crumb": "insecure-crumb",
                          "crumbRequestField": "Jenkins-Crumb"
                      }).encode())
                  elif '/api/json' in self.path:
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({
                          "result": "SUCCESS",
                          "building": False,
                          "number": 5,
                          "url": "http://localhost:8083/job/insecure-job/5/"
                      }).encode())
                  else:
                      self.send_response(200)
                      self.end_headers()

              def do_POST(self):
                  if 'build' in self.path or 'buildWithParameters' in self.path:
                      self.send_response(201)
                      self.send_header('Location', 'http://localhost:8083/queue/item/1/')
                      self.end_headers()
                  else:
                      self.send_response(200)
                      self.end_headers()

          httpd = socketserver.TCPServer(("", 8083), JenkinsHandler)
          httpd.serve_forever()
          EOF
          python3 /tmp/jenkins_insecure_server.py &
          sleep 2
          curl -sf http://localhost:8083/ || echo "Server check done"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://localhost:8083"
          user: "admin"
          token: "test-token"
          job: "insecure-job"
          insecure: "true"
          wait: "false"

      - name: Assert action ran with insecure SSL flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with insecure=true"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
