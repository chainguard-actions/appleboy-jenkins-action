name: Test debug mode with build parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with debug mode and parameters (expect failure - no Jenkins)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://127.0.0.1:19998/"
          user: "admin"
          token: "fake-token"
          job: "test-job"
          parameters: |
            BRANCH=main
            ENV=staging
            VERSION=1.0.0
          debug: "true"
          insecure: "false"

      - name: Assert action failed (no Jenkins server running)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins URL is unreachable, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins URL is unreachable"
