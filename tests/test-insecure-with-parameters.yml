name: Test insecure mode with build parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with insecure mode and build parameters (expect failure due to no Jenkins)
        id: action
        uses: .
        with:
          url: "https://jenkins.invalid.example.com:8443/"
          user: "testuser"
          token: "testtoken"
          job: "parameterized-job"
          insecure: "true"
          parameters: |
            BRANCH=main
            ENV=staging
            VERSION=1.0.0
          wait: "false"
        continue-on-error: true
      - name: Assert action failed (insecure mode does not prevent connection failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins URL is unreachable (insecure mode), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed in insecure mode when Jenkins URL is unreachable"
