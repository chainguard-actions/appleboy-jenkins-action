name: Test ca_cert input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Jenkins server
        run: |
          # Start a simple HTTP server to act as a mock Jenkins endpoint
          mkdir -p /tmp/mock-jenkins
          cat > /tmp/mock-jenkins/server.py << 'EOF'
          import http.server
          import socketserver
          import threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"_class":"hudson.model.FreeStyleProject","name":"test-job"}')
              def do_POST(self):
                  self.send_response(201)
                  self.send_header('Location', 'http://localhost:8080/queue/item/1/')
                  self.end_headers()
              def log_message(self, format, *args):
                  pass

          httpd = socketserver.TCPServer(("", 8080), Handler)
          httpd.serve_forever()
          EOF
          python3 /tmp/mock-jenkins/server.py &
          sleep 2
          echo "Mock Jenkins server started"
      - name: Generate self-signed CA cert
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ca-key.pem -out /tmp/ca-cert.pem \
            -days 1 -nodes -subj "/CN=test-ca"
          echo "CA cert generated"
          cat /tmp/ca-cert.pem
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://localhost:8080"
          user: "admin"
          token: "test-token"
          job: "test-job"
          ca_cert: "/tmp/ca-cert.pem"
          wait: "false"
          debug: "false"
      - name: Assert ca_cert input was accepted
        run: |
          echo "Action completed (may have failed to connect, which is expected)"
          echo "The ca_cert input was passed and processed"
          echo "PASS: ca_cert input covered"
