name: Test ca_cert input with unreachable Jenkins URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with ca_cert against unreachable Jenkins URL (expect failure)
        id: action
        uses: .
        with:
          url: "https://jenkins.invalid.example.com:8443/"
          user: "testuser"
          token: "testtoken"
          job: "test-job"
          wait: "false"
          ca_cert: |
            -----BEGIN CERTIFICATE-----
            MIICpDCCAYwCCQDU+pQ4pHgSpDANBgkqhkiG9w0BAQsFADAUMRIwEAYDVQQDDAls
            b2NhbGhvc3QwHhcNMjMwMTAxMDAwMDAwWhcNMjQwMTAxMDAwMDAwWjAUMRIwEAYD
            VQQDDAlsb2NhbGhvc3QwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC7
            o4qne60TB3pOBmcGBMDFGFMBMDFGFMBMDFGFMBMDFGFMBMDFGFMBMDFGFMBMDFG
            -----END CERTIFICATE-----
        continue-on-error: true
      - name: Assert action failed due to unreachable URL (ca_cert input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins URL is unreachable, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins URL is unreachable (ca_cert input was passed)"
