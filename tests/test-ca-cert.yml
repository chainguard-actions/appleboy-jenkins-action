name: Test ca_cert input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a self-signed CA cert for testing
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ca.key -out /tmp/ca.pem \
            -days 1 -nodes -subj "/CN=test-ca"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://127.0.0.1:19999/"
          user: "admin"
          token: "fake-token"
          job: "test-job"
          ca_cert: "/tmp/ca.pem"
          wait: "false"
          debug: "true"

      - name: Assert action ran with ca_cert input (connection failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no Jenkins at 127.0.0.1:19999,
          # but the important thing is that the ca_cert input was accepted and the
          # action attempted to connect (not a config/parse error).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no Jenkins server), ca_cert input was accepted"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (ca_cert input accepted)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
