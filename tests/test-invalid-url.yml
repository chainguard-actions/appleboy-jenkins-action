name: Test invalid Jenkins URL (connection refused)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unreachable Jenkins URL (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://127.0.0.1:19999/"
          user: "admin"
          token: "fake-token"
          job: "test-job"

      - name: Assert action failed due to unreachable URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins URL is unreachable, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins URL is unreachable"
