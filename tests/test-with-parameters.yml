name: Test Jenkins trigger with build parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://jenkins.example.invalid/"
          user: "admin"
          token: "fake-token"
          job: "my-job"
          parameters: |
            BRANCH=main
            ENV=staging
            DEPLOY=true
      - name: Assert action attempted connection and failed with parameters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins is unreachable (with parameters), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins server is unreachable (with parameters)"
