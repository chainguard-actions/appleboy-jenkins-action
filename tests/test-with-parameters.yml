name: Test Jenkins action with build parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Start a mock Jenkins server that records received parameters
      - name: Start mock Jenkins server
        run: |
          cat > /tmp/jenkins_params_server.py << 'EOF'
          import http.server
          import socketserver
          import json
          import urllib.parse

          class JenkinsHandler(http.server.BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_GET(self):
                  if '/crumbIssuer/api/json' in self.path:
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({
                          "crumb": "params-crumb",
                          "crumbRequestField": "Jenkins-Crumb"
                      }).encode())
                  elif '/api/json' in self.path:
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({
                          "result": "SUCCESS",
                          "building": False,
                          "number": 10,
                          "url": "http://localhost:8082/job/param-job/10/"
                      }).encode())
                  else:
                      self.send_response(200)
                      self.end_headers()

              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length).decode('utf-8') if content_length > 0 else ''
                  # Log the received parameters for debugging
                  with open('/tmp/jenkins_received_params.txt', 'w') as f:
                      f.write(f"path: {self.path}\nbody: {body}\n")
                  if 'build' in self.path or 'buildWithParameters' in self.path:
                      self.send_response(201)
                      self.send_header('Location', 'http://localhost:8082/queue/item/1/')
                      self.end_headers()
                  else:
                      self.send_response(200)
                      self.end_headers()

          httpd = socketserver.TCPServer(("", 8082), JenkinsHandler)
          httpd.serve_forever()
          EOF
          python3 /tmp/jenkins_params_server.py &
          sleep 2
          curl -sf http://localhost:8082/ || echo "Server check done"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://localhost:8082"
          user: "admin"
          token: "test-token"
          job: "param-job"
          parameters: |
            ENV=production
            VERSION=1.2.3
            DEPLOY=true
          wait: "false"
          debug: "true"

      - name: Assert action ran with parameters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with build parameters"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Show received parameters (if any)
        run: |
          if [ -f /tmp/jenkins_received_params.txt ]; then
            echo "Received by mock server:"
            cat /tmp/jenkins_received_params.txt
          else
            echo "No parameters file found (action may have failed before sending)"
          fi
