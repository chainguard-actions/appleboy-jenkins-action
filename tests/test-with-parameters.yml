name: Test Jenkins trigger with build parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Trigger Jenkins job with parameters (expect connection failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://localhost:8080/"
          user: "admin"
          token: "fake-token"
          job: "my-parameterized-job"
          parameters: |
            BRANCH=main
            ENV=staging
            DEPLOY=true
          insecure: "false"
          wait: "false"
          debug: "true"
      - name: Assert action failed due to connection error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Jenkins is unreachable (with parameters)"
