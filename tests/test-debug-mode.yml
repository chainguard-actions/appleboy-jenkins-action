name: Test Jenkins action debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Start a mock Jenkins server
      - name: Start mock Jenkins server
        run: |
          cat > /tmp/jenkins_server.py << 'EOF'
          import http.server
          import socketserver
          import json

          class JenkinsHandler(http.server.BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_GET(self):
                  if '/crumbIssuer/api/json' in self.path:
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({
                          "crumb": "debug-crumb",
                          "crumbRequestField": "Jenkins-Crumb"
                      }).encode())
                  elif '/api/json' in self.path:
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({
                          "result": "SUCCESS",
                          "building": False,
                          "number": 42,
                          "url": "http://localhost:8081/job/debug-job/42/"
                      }).encode())
                  else:
                      self.send_response(200)
                      self.end_headers()

              def do_POST(self):
                  if 'build' in self.path or 'buildWithParameters' in self.path:
                      self.send_response(201)
                      self.send_header('Location', 'http://localhost:8081/queue/item/1/')
                      self.end_headers()
                  else:
                      self.send_response(200)
                      self.end_headers()

          httpd = socketserver.TCPServer(("", 8081), JenkinsHandler)
          httpd.serve_forever()
          EOF
          python3 /tmp/jenkins_server.py &
          sleep 2
          curl -sf http://localhost:8081/ || echo "Server check done"

      - id: action
        uses: .
        continue-on-error: true
        with:
          url: "http://localhost:8081"
          user: "admin"
          token: "test-token"
          job: "debug-job"
          debug: "true"
          wait: "false"

      - name: Assert debug mode action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in debug mode"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
