name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with debug mode enabled (expect failure due to no Jenkins)
        id: action
        uses: .
        with:
          url: "http://jenkins.invalid.example.com:8080/"
          user: "debuguser"
          token: "debugtoken"
          job: "debug-test-job"
          debug: "true"
          wait: "false"
        continue-on-error: true
      - name: Assert action failed (debug mode does not prevent connection failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Jenkins URL is unreachable (debug mode), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed in debug mode when Jenkins URL is unreachable"
